# es SNOMED translation resource manifest (generated by the project wizard).
# Mirrors configs/resources_ko.yaml (see it for the full kind / scope / key_path DSL).
# Minimal seed: a base style guide + exemplar retrieval over the bilingual pool.
# Add es-specific term_dictionary / prompt_addendum / retrieval_corpus entries
# as SME-validated resources become available.

version: 1
language: es

defaults:
  overlap:
    prompt_addendum: additive
    term_dictionary: most_specific
    retrieval_corpus: additive
    exemplar_set: union_dedupe

resources:

  - id: base_style_guide
    kind: prompt_addendum
    scope: "<<138875005"
    payload:
      path: style_guide/es/style_guide_es_seed.md

  - id: pool_exemplars
    kind: exemplar_set
    scope: "<<138875005"
    payload:
      source: es_pool
